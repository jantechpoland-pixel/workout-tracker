<style>
/* One-column phone app, dark gym look: ink ground, mint accent, mono for numbers. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#0a0a0f; --card:#13131a; --raise:#1e1e2a; --fg:#f0f0f5; --muted:#8888a0; --faint:#55556a;
  --line:rgba(255,255,255,0.06); --line2:rgba(255,255,255,0.08);
  --mint:#6ee7b7; --mint-bg:rgba(110,231,183,0.12); --mint-line:rgba(110,231,183,0.3); --violet:#818cf8; --amber:#fbbf24; --orange:#fb923c; --red:#f87171;
  --sans:'Outfit',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  background:var(--bg);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;display:flex;flex-direction:column;padding-block:20px 24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.pill{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--mint);background:rgba(110,231,183,0.15);padding:5px 14px;border-radius:50px;display:inline-block}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;width:100%}
.seg button{flex:1;padding:9px 6px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.5px}
.seg button.on{background:var(--mint-bg);color:var(--mint)}
.tabs{display:flex;gap:8px;width:100%}
.tab{flex:1;padding:12px 8px;border-radius:14px;text-align:center;transition:all .25s ease;background:var(--card);color:var(--muted);border:1px solid var(--line)}
.tab.on{background:var(--mint-bg);color:var(--mint);border-color:rgba(110,231,183,0.35)}
.tab b{font-family:var(--mono);font-size:19px;font-weight:800;display:block}
.tab i{font-style:normal;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;opacity:.75;display:block;margin-top:2px}
.weeks{display:flex;align-items:center;gap:6px;width:100%}
.weeks .lbl{margin-right:auto}
.wk{width:38px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:13px;font-weight:700}
.wk.on{background:var(--mint-bg);color:var(--mint);border-color:var(--mint-line)}
.wk-icon{display:flex;align-items:center;justify-content:center;margin-left:6px}
.res td.rv{text-align:center;font-size:13px;font-weight:700;padding:10px 2px;width:44px;min-width:44px}
.res .exrow{display:flex;align-items:baseline;gap:6px}
.res .exrow .c{margin-right:0}
.res .ti{display:inline-block;width:12px;flex-shrink:0;font-size:14px;font-weight:700;text-align:center}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,rgba(110,231,183,0.18),rgba(110,231,183,0.08));color:var(--mint);border:1px solid var(--mint-line);border-radius:16px;font-size:16px;font-weight:700}
.btn-main{width:100%;padding:20px;background:linear-gradient(135deg,rgba(110,231,183,0.16),rgba(110,231,183,0.07));color:var(--mint);border:1px solid var(--mint-line);border-radius:20px;font-size:17px;font-weight:700;letter-spacing:.2px}
.btn-ghost{width:100%;padding:16px;background:transparent;color:var(--muted);border:1px solid var(--line2);border-radius:16px;font-size:15px;font-weight:600}
.btn-link{background:transparent;border:none;color:var(--faint);font-size:12.5px;font-weight:600;padding:4px}
.nav{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line2);color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.nav.off{color:#2a2a38}

.kgin::placeholder{color:var(--faint)}

.chip.on{color:var(--mint);border-color:var(--mint-line)}

.exn{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-0.2px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
.meta b{color:var(--mint);font-family:var(--mono);font-weight:700}
.hint{font-size:11.5px;color:var(--faint)}
.rpe{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:50px;border:1px solid var(--line2);color:var(--fg);line-height:1.2;white-space:nowrap}
.rpe svg{color:var(--muted)}
.rpe b{font-family:var(--mono);font-weight:700;font-size:12.5px}
.rpe span{color:var(--muted);font-weight:500}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;padding:11px 14px;background:transparent;border:none;border-top:1px solid var(--line);text-align:left;color:var(--fg)}
.prow:first-child{border-top:none}

.srow .stepbtn{width:32px;height:32px;font-size:16px}

.res{width:100%;border-collapse:collapse;font-size:12.5px}
.res th{font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);padding:6px 2px 8px;text-align:center;white-space:nowrap}
.res th:first-child{text-align:left;padding-left:16px}
.res th.cur{color:var(--mint)}
.res td{border-top:1px solid var(--line);padding:4px 2px;vertical-align:middle}
.res td.ex{padding:9px 4px 9px 14px;font-weight:600;line-height:1.25;min-width:96px}
.res td.ex .c{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--mint);margin-right:6px}
.res td:last-child{padding-right:10px}
.cell{width:100%;min-width:44px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cell.cur{background:rgba(110,231,183,0.06);border-color:rgba(110,231,183,0.18)}
.cell.empty{color:#2e2e3e;font-weight:400;font-size:16px}
.cell .n{font-size:9px;color:var(--amber);font-family:var(--sans);font-weight:600;letter-spacing:.5px}
.cell .kg{font-size:9px;color:var(--faint);font-weight:600}
/* edit sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line2);border-bottom:none;border-radius:22px 22px 0 0;padding:18px max(22px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet textarea{min-height:64px;resize:vertical}
@keyframes restPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes figBob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.fig-anim{animation:figBob 3.2s ease-in-out infinite;transform-origin:60px 60px;transform-box:fill-box}
.pulse{animation:restPulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fig-anim,.pulse{animation:none!important}.progress>div{transition:none}}
</style>

/* ─── storage: lokalna kopia + baza artefaktu ─── */
const SKEY = 'wf3_store';
function loadStore() {
  const base = { week:1, res:{}, history:[], media:{}, dirty:[], dirtyH:[], dirtyWeek:false, synced:false };
  try { const s = JSON.parse(localStorage.getItem(SKEY)); if (s && s.res) return Object.assign(base, s); } catch(e){}
  return base;
}
let store = loadStore();
const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify(store)); } catch(e){} };
const SEED_INIT = {"week": 2, "res": {"0|A1": {"1": {"kg": 40, "note": "ze sztangą"}}, "0|A2": {"1": {"kg": 8, "note": "piłka lekarska"}}, "0|B1": {"1": {"kg": 70, "note": "ze sztangą"}}, "0|B2": {"1": {"note": "Completed not sure if good technique"}}, "0|C1": {"1": {"kg": 15, "note": "talerz"}}, "0|D1": {"1": {"kg": 42.5}}, "0|D2": {"1": {"kg": 42.5}}, "0|E1": {"1": {"kg": 7.5}}, "0|E2": {"1": {"kg": 20}}, "1|A1": {"1": {"kg": 12.5}}, "1|A2": {"1": {"note": "Skrzynia dress is a"}}, "1|B1": {"1": {"kg": 40}}, "1|B2": {"1": {"kg": 60}}}};
if (!Object.keys(store.res).length && !store.history.length) { store.week = SEED_INIT.week; store.res = JSON.parse(JSON.stringify(SEED_INIT.res)); persist(); }

let DB = null, ASSETS = null, syncState = 'local', flushing = false;
const docId = key => key.replace('|', '-');
const hasDirty = () => store.dirty.length || store.dirtyH.length || store.dirtyWeek;
function setSync(s) { syncState = s; renderSyncDot(); }
function markDirty(key) { if (!store.dirty.includes(key)) store.dirty.push(key); persist(); flush(); }

async function flush() {
  if (!DB || flushing || !hasDirty()) return;
  flushing = true; setSync('sync');
  try {
    while (store.dirty.length) {
      const key = store.dirty[0], body = JSON.stringify(store.res[key] || {});
      const ref = DB.doc('results/' + docId(key));
      if (body !== '{}') await ref.set({ key, weeks:JSON.parse(body) }); else await ref.delete();
      if (JSON.stringify(store.res[key] || {}) === body) { store.dirty.shift(); persist(); }
    }
    while (store.dirtyH.length) {
      const t = store.dirtyH[0], e = store.history.find(x => x.t === t);
      if (e) await DB.doc('history/' + t).set(Object.assign({}, e));
      store.dirtyH.shift(); persist();
    }
    if (store.dirtyWeek) {
      const w = store.week;
      await DB.doc('app/settings').set({ week:w });
      if (store.week === w) { store.dirtyWeek = false; persist(); }
    }
    setSync('ok');
  } catch(e) { setSync(e && e.code === 'quota_exceeded' ? 'full' : 'offline'); }
  flushing = false;
}
setInterval(() => { if (hasDirty()) flush(); }, 20000);
window.addEventListener('online', () => flush());

async function connect() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e) {}
  if (!db) { setSync('local'); return; }
  DB = db; setSync('sync');
  if (!store.synced) store.history.forEach(e => { if (!store.dirtyH.includes(e.t)) store.dirtyH.push(e.t); });
  const timer = setTimeout(() => { if (syncState === 'sync') setSync('offline'); }, 10000);

  db.collection('results').onSnapshot(snap => {
    const fresh = !snap.metadata.fromCache, next = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.key && v.weeks) next[v.key] = JSON.parse(JSON.stringify(v.weeks)); });
    if (fresh && !store.synced) {
      /* pierwsza synchronizacja: wyślij wpisy z tej przeglądarki, których baza nie ma (lub są nowsze) */
      Object.keys(store.res).forEach(key => {
        const loc = store.res[key] || {}, merged = Object.assign({}, next[key] || {});
        let changed = false;
        Object.keys(loc).forEach(w => { const r = merged[w]; if (!r || (loc[w].t || 0) > (r.t || 0)) { merged[w] = loc[w]; changed = true; } });
        if (changed) { store.res[key] = merged; if (!store.dirty.includes(key)) store.dirty.push(key); }
      });
      store.synced = true;
    }
    store.dirty.forEach(key => { if (store.res[key]) next[key] = store.res[key]; else delete next[key]; });
    store.res = next; persist();
    if (fresh) { clearTimeout(timer); if (!flushing) setSync(hasDirty() ? 'sync' : 'ok'); flush(); }
    softRender();
  }, () => { clearTimeout(timer); setSync('offline'); });

  db.collection('history').orderBy('t', 'desc').limit(50).onSnapshot(snap => {
    const remote = snap.docs.map(d => Object.assign({}, d.data())).filter(e => e.t);
    const seen = new Set(remote.map(e => e.t));
    const local = store.history.filter(e => store.dirtyH.includes(e.t) && !seen.has(e.t));
    store.history = remote.concat(local).sort((a,b) => b.t - a.t).slice(0,50);
    persist(); softRender();
  }, () => {});

  /* własne wideo / zdjęcia ćwiczeń: plik w magazynie artefaktu, wskaźnik w bazie */
  db.collection('media').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.key && v.id) m[v.key] = { id:v.id, type:v.type || 'video' }; });
    store.media = m; persist(); softRender();
  }, () => {});

  db.doc('app/settings').onSnapshot(s => {
    if (!s.exists || store.dirtyWeek) return;
    const w = s.data().week;
    if (WEEKS.includes(w) && w !== store.week) { store.week = w; persist(); softRender(); }
  }, () => {});
}

/* nie przerysowuj, gdy ktoś właśnie wpisuje wartość */
let renderPending = false;
function softRender() {
  const a = document.activeElement;
  if (S.edit || (a && /INPUT|TEXTAREA/.test(a.tagName))) { renderPending = true; return; }
  render();
}
document.addEventListener('focusout', () => {
  if (!renderPending) return;
  setTimeout(() => { const a = document.activeElement; if (!S.edit && !(a && /INPUT|TEXTAREA/.test(a.tagName))) { renderPending = false; render(); } }, 0);
});

const rkey = (p, code) => p + '|' + code;
const getR = (key, w) => (store.res[key] || {})[w] || null;
function prevKg(key, w) { for (let i = w; i >= 1; i--) { const r = getR(key, i); if (r && r.kg != null) return { kg:r.kg, week:i }; } return null; }
function setR(key, w, patch) {
  const m = store.res[key] || (store.res[key] = {});
  const r = Object.assign({}, m[w] || {}, patch, { t:Date.now() });
  if (r.kg == null) delete r.kg;
  if (!r.note) delete r.note;
  if (!r.sets || !r.sets.some(v => v != null)) delete r.sets;
  if (r.kg == null && !r.note) delete m[w]; else m[w] = r;
  if (!Object.keys(m).length) delete store.res[key];
  markDirty(key);
}
const parseKg = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; };

/* ─── app state ─── */
const S = { screen:'home', view:'plan', /* widok Wyniki ukryty na razie (wynikiCard zostaje na później) */ plan:0, blockI:0, doneBlocks:0, doneSets:0, restLeft:0, restTotal:0, elapsed:0, img:null, showW:{}, edit:null };
const stepsCache = {};
const groupOf = e => e.block || e.code[0];
function STEPS(plan) {
  if (stepsCache[plan]) return stepsCache[plan];
  const W = PLANS[plan].W, groups = [];
  W.forEach((e,i) => { const L = groupOf(e), g = groups[groups.length-1];
    if (g && g.letter === L) g.exs.push(i); else groups.push({ letter:L, exs:[i] }); });
  const steps = [];
  groups.forEach(g => { const rounds = W[g.exs[0]].sets;
    for (let r=1; r<=rounds; r++) g.exs.forEach(i => steps.push({ ex:i, set:r, rest:W[i].rest })); });
  return stepsCache[plan] = steps;
}
const fmt = sec => Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
const fnum = w => w % 1 ? String(w).replace('.', ',') : String(w);
const fkg = w => fnum(w) + ' kg';
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const setsLabel = e => e.min ? e.min + '–' + e.sets : String(e.sets);

function tempoHint(t) {
  if (t === 'X!' || t === 'X') return 'maks. dynamicznie';
  if (!/^[0-9X!]{4}$/.test(t)) return '';
  const c = t.split(''), v = x => x === 'X' || x === '!' ? 'dyn.' : x + ' s';
  const p = ['↓ ' + v(c[0])];
  if (c[1] !== '0') p.push('pauza ' + v(c[1]));
  p.push('↑ ' + v(c[2]));
  if (c[3] !== '0') p.push('góra ' + v(c[3]));
  return p.join(' · ');
}

/* ─── sound, vibration, screen on ─── */
let actx, wakeLock = null;
function tone(freq, delays, vol, dur) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    delays.forEach(dt => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime + dt);
      g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dt + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + dt); o.stop(actx.currentTime + dt + dur + 0.02);
    });
  } catch(e){}
}
const tap = () => { try { navigator.vibrate && navigator.vibrate(40); } catch(e){} tone(660, [0], 0.18, 0.12); };
const cue = () => { try { navigator.vibrate && navigator.vibrate([180,90,180]); } catch(e){} tone(880, [0,0.22], 0.25, 0.16); };
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (S.screen === 'workout' || S.screen === 'rest')) keepAwake(true); });

function saveWorkout() {
  const e = { t:Date.now(), plan:S.plan, week:store.week, secs:S.elapsed, sets:S.doneSets };
  store.history.unshift(e); store.history = store.history.slice(0,50);
  store.dirtyH.push(e.t); persist(); flush();
}

/* ─── bloki (A, B, C…): jeden ekran na blok ─── */
const blocksCache = {};
function BLOCKS(plan) {
  if (blocksCache[plan]) return blocksCache[plan];
  const out = [];
  PLANS[plan].W.forEach((e,i) => { const L = groupOf(e), g = out[out.length-1];
    if (g && g.letter === L) g.exs.push(i); else out.push({ letter:L, exs:[i] }); });
  return blocksCache[plan] = out;
}
function curBlock() { const B = BLOCKS(S.plan); return { B, blk:B[Math.min(S.blockI, B.length-1)], W:PLANS[S.plan].W }; }
const blockRest = (blk, W) => W[blk.exs[blk.exs.length-1]].rest || 0;
/* rekomendowany ciężar: wpis z tego tygodnia (bez rozbicia na serie) albo ostatni tydzień */
function baseKg(key) {
  const r = getR(key, store.week);
  if (r && r.kg != null && !(r.sets && r.sets.length)) return r.kg;
  const p = prevKg(key, store.week - 1);
  return p ? p.kg : (r && r.kg != null ? r.kg : null);
}
/* ciężar każdej serii: wpisany albo przeniesiony z poprzedniej serii / rekomendowany */
function setVals(key, n, sets) {
  const r = getR(key, store.week);
  sets = sets || (r && r.sets) || [];
  const out = []; let last = baseKg(key);
  for (let i = 0; i < n; i++) { if (sets[i] != null) last = sets[i]; out.push(last); }
  return out;
}
function saveSets(key, sets, n) {
  const vals = setVals(key, n, sets).filter(v => v != null);
  setR(key, store.week, { sets, kg:vals.length ? Math.max(...vals) : null });
}
const exByKey = key => { const [p, code] = key.split('|'); return PLANS[+p].W.find(e => e.code === code); };

/* ─── actions ─── */
const A = {
  view(v) { S.view = v; render(); },
  pick(i) { S.plan = i; render(); },
  week(w) { store.week = w; store.dirtyWeek = true; persist(); flush(); render(); },
  start() { S.screen = 'workout'; S.blockI = 0; S.doneBlocks = 0; S.doneSets = 0; S.elapsed = 0; S.img = null; S.vid = null; S.showW = {}; S.restLeft = 0; keepAwake(true); render(); window.scrollTo(0,0); },
  quit() { S.screen = 'home'; S.blockI = 0; S.doneBlocks = 0; S.doneSets = 0; S.elapsed = 0; S.restLeft = 0; keepAwake(false); render(); },
  nav(d) {
    if (d < 0 && S.blockI <= 0) return A.quit();
    S.blockI = Math.min(BLOCKS(S.plan).length-1, Math.max(0, S.blockI + d));
    S.img = null; S.vid = null; S.restLeft = 0; render(); window.scrollTo(0,0);
  },
  setBump(key, i, d) {
    const n = exByKey(key).sets, vals = setVals(key, n), r = getR(key, store.week) || {};
    const sets = (r.sets || []).slice(); while (sets.length < n) sets.push(null);
    sets[i] = Math.max(0, Math.round(((vals[i] || 0) + d) * 100) / 100);
    saveSets(key, sets, n); render();
  },
  setType(key, i, v) {
    const n = exByKey(key).sets, r = getR(key, store.week) || {};
    const sets = (r.sets || []).slice(); while (sets.length < n) sets.push(null);
    sets[i] = parseKg(v);
    saveSets(key, sets, n); render();
  },
  addW(key) { S.showW[key] = 1; render(); setTimeout(() => { const el = document.getElementById('kg-' + docId(key) + '-0'); if (el) el.focus(); }, 30); },
  toggleImg(code) { S.img = S.img === code ? null : code; render(); },
  toggleVid(key) { S.vid = S.vid === key ? null : key; render(); },
  pickMedia(key) { S.uploadKey = key; const el = document.getElementById('mediaIn'); if (el) { el.value = ''; el.click(); } },
  async gotMedia(file) {
    const key = S.uploadKey;
    if (!file || !key || !ASSETS || !DB) return;
    let type = file.type;
    if (type === 'video/quicktime' || (!type && /\.(mov|mp4)$/i.test(file.name))) type = 'video/mp4';
    S.uploading = key; S.mediaErr = null; render();
    try {
      const r = await ASSETS.upload(file, type && type !== file.type ? { type } : undefined);
      const kind = String(r.contentType || type).startsWith('image') ? 'image' : 'video';
      const prev = store.media[key];
      await DB.doc('media/' + docId(key)).set({ key, id:r.id, type:kind });
      store.media[key] = { id:r.id, type:kind }; persist(); S.vid = key;
      if (prev && prev.id && prev.id !== r.id) ASSETS.delete(prev.id).catch(() => {});
    } catch(e) {
      const c = e && e.code;
      S.mediaErr = { key, msg:c === 'too_large' ? 'Plik za duży (max 20 MB). Przytnij nagranie.'
        : c === 'unsupported_type' ? 'Ten format nie działa. Użyj MP4, WebM albo zdjęcia.'
        : c === 'quota_or_state' ? 'Brak miejsca na pliki w aplikacji.'
        : 'Nie udało się wgrać. Spróbuj ponownie.' };
    }
    S.uploading = null; render();
  },
  rest() {
    const { blk, W } = curBlock();
    if (S.restLeft > 0) S.restLeft = 0;
    else { S.restTotal = blockRest(blk, W); S.restLeft = S.restTotal; tap(); }
    renderRest();
  },
  done() {
    const { B, blk, W } = curBlock();
    blk.exs.forEach(i => {
      const key = rkey(S.plan, W[i].code), vals = setVals(key, W[i].sets);
      if (vals.some(v => v != null)) saveSets(key, vals, W[i].sets);
      S.doneSets += W[i].sets;
    });
    tap(); S.doneBlocks++; S.img = null; S.vid = null; S.restLeft = 0;
    if (S.blockI >= B.length-1) { saveWorkout(); S.screen = 'done'; keepAwake(false); }
    else S.blockI++;
    render(); window.scrollTo(0,0);
  },
  edit(key, w) { S.edit = { key, w }; render(); },
  closeEdit() { S.edit = null; render(); },
  editBump(d) { const el = document.getElementById('sheetKg'); const v = parseKg(el.value) || 0; el.value = fnum(Math.max(0, Math.round((v + d) * 100) / 100)); },
  saveEdit() {
    const { key, w } = S.edit;
    const kg = parseKg(document.getElementById('sheetKg').value), old = getR(key, w) || {};
    const patch = { kg, note:document.getElementById('sheetNote').value.trim() };
    if (kg !== old.kg) patch.sets = null;
    setR(key, w, patch);
    S.edit = null; render();
  },
  clearEdit() { const { key, w } = S.edit; const m = store.res[key]; if (m) { delete m[w]; if (!Object.keys(m).length) delete store.res[key]; } markDirty(key); S.edit = null; render(); }
};

/* ─── timer: czas treningu + opcjonalna przerwa ─── */
setInterval(() => {
  if (S.screen !== 'workout') return;
  S.elapsed++;
  const el = document.getElementById('elT'); if (el) el.textContent = fmt(S.elapsed);
  if (S.restLeft > 0) { S.restLeft--; if (S.restLeft === 0) cue(); renderRest(); }
}, 1000);
function renderRest() {
  const b = document.getElementById('restBtn'); if (!b) return;
  const { blk, W } = curBlock();
  b.classList.toggle('on', S.restLeft > 0);
  b.innerHTML = S.restLeft > 0
    ? `Przerwa <span class="mono">${fmt(S.restLeft)}</span> · dotknij, żeby zatrzymać`
    : `Start przerwy <span class="mono">${fmt(blockRest(blk, W))}</span>`;
}

/* ─── views ─── */
function figSvg(type, size, anim) {
  const f = FIGS[type]; if (!f) return '';
  const dim = f.d.map(d => `<path d="${d}" stroke="rgba(255,255,255,0.12)" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('');
  const main = `<g class="${anim ? 'fig-anim' : ''}" stroke="rgba(110,231,183,0.5)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="${f.h[0]}" cy="${f.h[1]}" r="7.5"/>${f.p.map(d => `<path d="${d}"/>`).join('')}</g>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" style="overflow:visible" aria-hidden="true">${dim}${main}</svg>`;
}

/* Wyniki: wizualny postęp, liczony z zapisanych treningów (najcięższa seria w tygodniu) */
function trend(key) {
  const pts = WEEKS.map(w => { const r = getR(key, w); return r && r.kg != null ? { w, kg:r.kg } : null; }).filter(Boolean);
  const last = pts[pts.length - 1], prev = pts[pts.length - 2];
  return { pts, last, d:last && prev ? Math.round((last.kg - prev.kg) * 100) / 100 : null };
}
function sparkline(pts) {
  const Wd = 96, H = 34, px = w => 5 + (w - 1) * (Wd - 10) / 3;
  const grid = WEEKS.map(w => `<line x1="${px(w)}" y1="3" x2="${px(w)}" y2="${H - 3}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`).join('');
  if (!pts.length) return `<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" aria-hidden="true">${grid}</svg>`;
  const ks = pts.map(p => p.kg), lo = Math.min(...ks), hi = Math.max(...ks);
  const py = kg => hi === lo ? H / 2 : 5 + (hi - kg) * (H - 10) / (hi - lo);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + px(p.w).toFixed(1) + ' ' + py(p.kg).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const area = pts.length > 1 ? `<path d="${line} L${px(last.w).toFixed(1)} ${H - 3} L${px(pts[0].w).toFixed(1)} ${H - 3} Z" fill="rgba(110,231,183,0.12)"/>` : '';
  const dots = pts.map((p, i) => i === pts.length - 1
    ? `<circle cx="${px(p.w)}" cy="${py(p.kg)}" r="3.5" fill="#6ee7b7"/>`
    : `<circle cx="${px(p.w)}" cy="${py(p.kg)}" r="2" fill="#13131a" stroke="#6ee7b7" stroke-width="1.5"/>`).join('');
  return `<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" aria-hidden="true">${grid}${area}${pts.length > 1 ? `<path d="${line}" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${dots}</svg>`;
}
function deltaBadge(d) {
  if (d == null) return '';
  if (d > 0) return `<span class="delta" style="color:var(--mint)">▲ +${fnum(d)}</span>`;
  if (d < 0) return `<span class="delta" style="color:var(--amber)">▼ −${fnum(-d)}</span>`;
  return `<span class="delta" style="color:var(--faint)">= bez zmian</span>`;
}

/* prosta tabela wyników: najcięższa seria w każdym tygodniu */
function wynikiTable() {
  const P = PLANS[S.plan];
  const rows = P.W.filter(e => e.load);
  return `
    <div class="card" style="padding:12px 0 10px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 12px 2px 14px">
        <span class="lbl">Wyniki · ${esc(P.title)}</span>
        <button class="nav" style="width:32px;height:32px;font-size:14px" onclick="A.view('plan')" aria-label="Zamknij wyniki">✕</button>
      </div>
      <div style="overflow-x:auto">
        <table class="res">
          <thead><tr><th>Ćwiczenie · tydzień</th>${WEEKS.map(w => `<th class="${w === store.week ? 'cur' : ''}">${w}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(e => {
            const key = rkey(S.plan, e.code); let prev = null;
            const d = trend(key).d;
            const ti = d == null ? '<span class="ti" aria-hidden="true"></span>'
              : d > 0 ? '<span class="ti" style="color:var(--mint)" title="Postęp" aria-label="postęp">↗</span>'
              : d < 0 ? '<span class="ti" style="color:var(--amber)" title="Spadek" aria-label="spadek">↘</span>'
              : '<span class="ti" style="color:var(--muted)" title="Bez zmian" aria-label="bez zmian">→</span>';
            return `<tr><td class="ex"><span class="exrow"><span class="c">${e.code}</span>${ti}<span>${esc(e.name)}</span></span></td>${WEEKS.map(w => {
              const r = getR(key, w), kg = r && r.kg != null ? r.kg : null;
              let col = 'var(--fg)';
              if (kg != null && prev != null) col = kg > prev ? 'var(--mint)' : kg < prev ? 'var(--amber)' : 'var(--fg)';
              if (kg != null) prev = kg;
              return `<td class="rv mono" style="color:${col}">${kg != null ? fnum(kg) : '<span style="color:#34344a">–</span>'}</td>`;
            }).join('')}</tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      <div style="font-size:11px;color:var(--faint);padding:2px 14px 0">kg, najcięższa seria w tygodniu · <span style="color:var(--mint)">↗</span> postęp · <span style="color:var(--muted)">→</span> bez zmian · <span style="color:var(--amber)">↘</span> spadek</div>
    </div>`;
}

function wynikiCard() {
  const P = PLANS[S.plan];
  const rows = P.W.filter(e => e.load).map(e => ({ e, key:rkey(S.plan, e.code), t:trend(rkey(S.plan, e.code)) }));
  const cmp = rows.filter(r => r.t.d != null);
  const up = cmp.filter(r => r.t.d > 0).length, same = cmp.filter(r => r.t.d === 0).length, down = cmp.filter(r => r.t.d < 0).length;
  return `
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <span class="lbl">Postęp · ${esc(P.title)}</span>
      ${cmp.length ? `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <div class="stat"><div class="k">W górę</div><div class="v" style="color:var(--mint)">${up}</div></div>
        <div class="stat"><div class="k">Bez zmian</div><div class="v">${same}</div></div>
        <div class="stat"><div class="k">W dół</div><div class="v" style="color:${down ? 'var(--amber)' : 'var(--fg)'}">${down}</div></div>
      </div>` : `<div style="font-size:13px;color:var(--muted)">Postęp pokaże się, gdy zapiszesz trening w drugim tygodniu.</div>`}
    </div>
    <div class="card" style="padding:4px 0;display:flex;flex-direction:column">
      ${rows.map(({ e, key, t }) => `
      <button class="prow" onclick="A.edit('${key}',${t.last ? t.last.w : store.week})" aria-label="${esc(e.name)}: popraw wpis">
        <span class="c mono">${e.code}</span>
        <span class="pn">${esc(e.name)}<small>${t.pts.length ? t.pts.map(p => fnum(p.kg)).join(' → ') + ' kg' : 'brak wpisów'}</small></span>
        ${sparkline(t.pts)}
        <span class="pv mono">${t.last ? fnum(t.last.kg) + '<small>kg</small>' : '—'}${deltaBadge(t.d)}</span>
      </button>`).join('')}
    </div>
    <div style="font-size:11.5px;color:var(--faint);text-align:center">Wyniki zapisują się same po „Serie zrobione”. Dotknij ćwiczenia, żeby poprawić wpis.</div>`;
}

function editSheet() {
  const { key, w } = S.edit;
  const [p, code] = key.split('|');
  const ex = PLANS[+p].W.find(e => e.code === code);
  const r = getR(key, w) || {};
  const prev = prevKg(key, w - 1);
  return `
  <div class="scrim" onclick="A.closeEdit()"></div>
  <div class="sheet" role="dialog" aria-label="Wynik: ${esc(ex.name)}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <span class="lbl">Tydzień ${w} · ${ex.code}</span>
        <h3 style="font-size:19px;font-weight:800;line-height:1.2;text-wrap:balance">${esc(ex.name)}</h3>
        <span style="font-size:12px;color:var(--muted)">${ex.sets} × ${esc(ex.reps)}${prev ? ' · tydz. ' + prev.week + ': ' + fkg(prev.kg) : ''}</span>
        ${r.sets ? `<span style="font-size:12px;color:var(--mint)" class="mono">Serie: ${r.sets.filter(v => v != null).map(fnum).join(' · ')} kg</span>` : ''}
      </div>
      <button class="nav" style="flex-shrink:0;width:36px;height:36px;font-size:16px" onclick="A.closeEdit()" aria-label="Zamknij">✕</button>
    </div>
    <div class="wbox" style="flex-direction:row;align-items:center;justify-content:space-between">
      <label for="sheetKg" class="lbl" style="font-size:10px;letter-spacing:1px">Ciężar (kg)</label>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="stepbtn minus" onclick="A.editBump(-2.5)" aria-label="Minus 2,5 kg">−</button>
        <input id="sheetKg" class="kgin" inputmode="decimal" autocomplete="off" value="${r.kg != null ? fnum(r.kg) : ''}" placeholder="—">
        <button class="stepbtn plus" onclick="A.editBump(2.5)" aria-label="Plus 2,5 kg">+</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="sheetNote" class="lbl" style="font-size:10px;letter-spacing:1px">Notatka</label>
      <textarea id="sheetNote" class="notein" placeholder="np. ze sztangą, technika do poprawy">${esc(r.note || '')}</textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-ghost" style="flex:1;padding:14px" onclick="A.clearEdit()">Wyczyść</button>
      <button class="btn-primary" style="flex:2;padding:14px" onclick="A.saveEdit()">Zapisz</button>
    </div>
  </div>`;
}

/* tempo jako ikonka: ↓ w dół, ⏸ pauza, ↑ w górę, ⚡ dynamicznie */
function tempoBadge(t) {
  if (!t) return '';
  const clock = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 3.2V6l2 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  let body = esc(t), title = 'Tempo: ' + esc(t);
  if (t === 'X!' || t === 'X') { body = '⚡ X!'; title = 'Tempo X!: maksymalnie dynamicznie'; }
  else if (/^[0-9X!]{4}$/.test(t)) {
    const c = t.split(''), v = x => (x === 'X' || x === '!') ? '⚡' : x + 's';
    const seg = ['↓' + v(c[0])];
    if (c[1] !== '0') seg.push('⏸' + v(c[1]));
    seg.push('↑' + v(c[2]));
    if (c[3] !== '0') seg.push('⏸' + v(c[3]));
    body = seg.join(' ');
    title = 'Tempo ' + t + ': ' + tempoHint(t);
  }
  return `<span class="tbadge" title="${title}">${clock}<span>${body}</span></span>`;
}

/* RPE jako ikonka: słupki = intensywność, liczba, ile powtórzeń w zapasie */
function rpeBadge(rpe) {
  const nums = String(rpe).split('/').map(Number).filter(n => n >= 1 && n <= 10);
  if (!nums.length) return `<span class="meta">RPE ${esc(rpe)}</span>`;
  const hi = Math.max(...nums), lo = Math.min(...nums);
  const lv = Math.max(1, Math.min(4, hi - 6));
  const rir = hi === 10 && lo === 10 ? 'do upadku' : (hi === lo ? (10 - hi) : (10 - hi) + '–' + (10 - lo)) + ' w zapasie';
  const bars = [0,1,2,3].map(i => `<rect x="${i * 3.5}" y="${9 - i * 3}" width="2.5" height="${3 + i * 3}" rx="1" fill="${i < lv ? 'currentColor' : 'rgba(255,255,255,0.15)'}"/>`).join('');
  return `<span class="rpe lv${lv}" title="RPE ${esc(rpe)}: wysiłek w skali 1–10, ${rir}"><svg width="13" height="12" viewBox="0 0 13 12" aria-hidden="true">${bars}</svg><b>${esc(rpe)}</b><span>${rir}</span></span>`;
}

function mediaChips(ex, key) {
  const media = store.media[key], out = [];
  if (ex.img) out.push(`<button class="chip ${S.img === ex.code ? 'on' : ''}" onclick="A.toggleImg('${ex.code}')">${S.img === ex.code ? 'Ukryj zdjęcie' : 'Zdjęcie'}</button>`);
  if (media) out.push(`<button class="chip ${S.vid === key ? 'on' : ''}" onclick="A.toggleVid('${key}')">${S.vid === key ? 'Ukryj wideo' : (media.type === 'image' ? 'Twoje zdjęcie' : '▶ Wideo')}</button>`);
  else if (ex.video) out.push(`<a class="chip" href="${esc(ex.video)}" target="_blank" rel="noopener">▶ YouTube</a>`);
  return out.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${out.join('')}</div>` : '';
}

function exCard(ex) {
  const key = rkey(S.plan, ex.code);
  const media = store.media[key];
  const base = baseKg(key);
  const vals = setVals(key, ex.sets);
  const hasW = ex.load || vals.some(v => v != null) || S.showW[key];
  const prev = prevKg(key, store.week - 1);
  const hint = prev ? 'tydz. ' + prev.week + ': ' + fkg(prev.kg) : (base == null ? 'wpisz ciężar' : '');
  return `
    <div class="card exc">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span class="code mono">${ex.code}</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <h2 class="exn">${esc(ex.name)}</h2>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${hasW ? '' : `<span class="meta"><b>${setsLabel(ex)} × ${esc(ex.reps)}</b></span>`}${tempoBadge(ex.tempo)}${ex.rpe ? rpeBadge(ex.rpe) : ''}</div>
          ${ex.note ? `<div class="hint">${esc(ex.note)}</div>` : ''}
        </div>
      </div>
      ${mediaChips(ex, key)}
      ${S.img === ex.code && ex.img ? `<img class="photo" src="img/${ex.img}" alt="${esc(ex.name)}">` : ''}
      ${S.vid === key && media ? (media.type === 'image'
        ? `<img class="photo" src="/_blob/${media.id}" alt="${esc(ex.name)}">`
        : `<video class="photo" src="/_blob/${media.id}" controls playsinline loop muted autoplay></video>`) : ''}
      ${S.mediaErr && S.mediaErr.key === key ? `<div style="font-size:12px;color:var(--amber)">${esc(S.mediaErr.msg)}</div>` : ''}
      ${hasW ? `
      <div class="sets">
        <div class="sets-h">
          <span class="lbl" style="font-size:10px;letter-spacing:1px">Rekomendowany ciężar</span>
          <span style="font-size:11px;color:var(--muted)">${hint}</span>
        </div>
        ${vals.map((v, i) => {
          const id = 'kg-' + docId(key) + '-' + i;
          const opt = ex.min && i >= ex.min;
          return `<div class="srow">
            <label for="${id}" class="sn">Seria ${i + 1}${opt ? ' <span style="color:var(--faint)">(opc.)</span>' : ''}<small>× ${esc(ex.reps)}</small></label>
            <div style="display:flex;align-items:center;gap:6px">
              <button class="stepbtn minus" onclick="A.setBump('${key}',${i},-2.5)" aria-label="Seria ${i + 1}: minus 2,5 kg">−</button>
              <input id="${id}" class="kgin" inputmode="decimal" autocomplete="off" value="${v != null ? fnum(v) : ''}" placeholder="—" onchange="A.setType('${key}',${i},this.value)" aria-label="Seria ${i + 1}, ciężar w kg"><span class="unit" aria-hidden="true">kg</span>
              <button class="stepbtn plus" onclick="A.setBump('${key}',${i},2.5)" aria-label="Seria ${i + 1}: plus 2,5 kg">+</button>
            </div>
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>`;
}

function workoutView() {
  const { B, blk, W } = curBlock();
  const L = blk.letter;
  const regular = B.filter(b => !BLOCK_NAME[b.letter]);
  const counter = BLOCK_NAME[L] ? BLOCK_NAME[L] : 'Blok ' + L + ' · ' + (regular.indexOf(blk) + 1) + ' / ' + regular.length;
  const pct = Math.round((S.blockI + 1) / B.length * 100);
  return `
  <div style="display:flex;flex-direction:column;flex:1;gap:14px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="nav" onclick="A.nav(-1)" aria-label="Wstecz">‹</button>
      <span class="mono" style="font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:center">${esc(counter)} · tydz. ${store.week}</span>
      <button class="nav ${S.blockI >= B.length-1 ? 'off' : ''}" onclick="A.nav(1)" aria-label="Dalej">›</button>
    </div>
    <div>
      <div class="progress" style="margin-bottom:6px"><div style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span id="elT" class="mono" style="font-size:11px;font-weight:700;color:var(--mint)">${fmt(S.elapsed)}</span>
      </div>
    </div>
    ${blk.exs.map(i => exCard(W[i])).join('')}
    <div style="flex:1"></div>
    <button class="btn-main" onclick="A.done()">Serie zrobione</button>
  </div>`;
}

function doneView() {
  const P = PLANS[S.plan];
  const logged = P.W.filter(e => !e.block && getR(rkey(S.plan, e.code), store.week)?.kg != null).length;
  return `
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:12px 0">
    <div style="width:88px;height:88px;border-radius:50%;background:var(--mint-bg);border:1px solid var(--mint-line);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--mint);box-shadow:0 0 50px rgba(110,231,183,0.2)">✓</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <h2 style="font-size:28px;font-weight:900;letter-spacing:-0.4px">Trening ukończony</h2>
      <span style="color:var(--muted);font-size:14.5px">Dobra robota. Spokojnie się rozciągnij.</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;width:100%;max-width:340px">
      <div style="background:var(--raise);padding:18px 8px"><div class="mono" style="font-size:20px;font-weight:800;color:var(--mint)">${fmt(S.elapsed)}</div><div class="lbl" style="font-size:10px;letter-spacing:1px;margin-top:4px">Czas</div></div>
      <div style="background:var(--raise);padding:18px 8px"><div class="mono" style="font-size:20px;font-weight:800;color:var(--mint)">${S.doneSets}</div><div class="lbl" style="font-size:10px;letter-spacing:1px;margin-top:4px">Serie</div></div>
      <div style="background:var(--raise);padding:18px 8px"><div class="mono" style="font-size:20px;font-weight:800;color:var(--mint)">${logged}</div><div class="lbl" style="font-size:10px;letter-spacing:1px;margin-top:4px">Ciężary</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px">
      <button class="btn-primary" onclick="A.quit()">Wróć do startu</button>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = S.screen === 'home' ? homeView() : S.screen === 'workout' ? workoutView() : doneView();
  renderRest();
  if (S.edit) { const el = document.getElementById('sheetKg'); if (el && !el.value) el.focus(); }
  renderSyncDot();
}
const SYNC_LABEL = { local:'zapisano na tym urządzeniu', sync:'synchronizuję…', ok:'zsynchronizowano', offline:'offline, zapisane lokalnie', full:'baza pełna, zapisane lokalnie' };
const SYNC_COLOR = { local:'var(--faint)', sync:'var(--amber)', ok:'var(--mint)', offline:'var(--amber)', full:'var(--amber)' };
function renderSyncDot() {
  const el = document.getElementById('syncDot');
  if (el) el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${SYNC_COLOR[syncState]};display:inline-block"></span> ${SYNC_LABEL[syncState]}`;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.edit) A.closeEdit(); });

render();
connect();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
