<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0f;color:#f0f0f5;min-height:100vh;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:'Outfit',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mono{font-family:'JetBrains Mono',monospace}
.app{min-height:100vh;min-height:100dvh;max-width:420px;margin:0 auto;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
.card{background:#13131a;border:1px solid rgba(255,255,255,0.06);border-radius:20px}
.pill{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#6ee7b7;background:rgba(110,231,183,0.15);padding:5px 14px;border-radius:50px;display:inline-block}
.tabs{display:flex;gap:8px;width:100%}
.tab{flex:1;padding:12px 8px;border-radius:14px;text-align:center;transition:all .25s ease;background:#13131a;color:#8888a0;border:1px solid rgba(255,255,255,0.06)}
.tab.on{background:rgba(110,231,183,0.12);color:#6ee7b7;border-color:rgba(110,231,183,0.35)}
.tab b{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800;display:block}
.tab i{font-style:normal;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;opacity:.75;display:block;margin-top:2px}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,rgba(110,231,183,0.18),rgba(110,231,183,0.08));color:#6ee7b7;border:1px solid rgba(110,231,183,0.3);border-radius:16px;font-size:16px;font-weight:700}
.btn-main{width:100%;padding:20px;background:linear-gradient(135deg,rgba(110,231,183,0.16),rgba(110,231,183,0.07));color:#6ee7b7;border:1px solid rgba(110,231,183,0.3);border-radius:20px;font-size:17px;font-weight:700;letter-spacing:.2px}
.btn-ghost{width:100%;padding:16px;background:transparent;color:#8888a0;border:1px solid rgba(255,255,255,0.08);border-radius:16px;font-size:15px;font-weight:600}
.nav{width:44px;height:44px;border-radius:50%;background:#13131a;border:1px solid rgba(255,255,255,0.08);color:#8888a0;font-size:20px;display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.nav.off{color:#2a2a38}
.lbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#55556a}
.stat{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);padding:12px 8px;border-radius:14px;text-align:center}
.stat .k{font-size:10px;color:#55556a;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:#f0f0f5}
.stepbtn{width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
.progress{background:rgba(255,255,255,0.05);height:5px;border-radius:3px;overflow:hidden}
.progress>div{height:100%;border-radius:3px;background:linear-gradient(90deg,#6ee7b7,#818cf8);transition:width .5s cubic-bezier(.4,0,.2,1)}
@keyframes restPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes figBob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.fig-anim{animation:figBob 3.2s ease-in-out infinite;transform-origin:60px 60px;transform-box:fill-box}
</style>
</head>
<body>
<div id="root" class="app"></div>
<script>
/* ═══ KONFIGURACJA — patrz SETUP.md ═══ */
const SUPABASE_URL = 'https://ymowelnxdgrhikuvxpdh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vBDYrPGZQ4VFcFgBXAnj5A_bABKagFu';
const SYNC_KEY = 'ffa5a5547543a7576cce3e7136b3086e9a43519cbaccef31';
/* ═════════════════════════════════════ */

const PLANS = [
 {title:'Siła — całe ciało',tag:'Siła',hero:'squat',W:[
  {code:'A1',name:'Heavy back squat',sets:3,reps:'3',tempo:'3010',weight:'80 kg',rest:0},
  {code:'A2',name:'Lateral squat hold',sets:3,reps:'10 s + 5',tempo:'X!',weight:'16 kg KB',rest:120},
  {code:'B1',name:'RDL',sets:3,reps:'6',tempo:'30X0',weight:'80 kg',rest:0},
  {code:'B2',name:'Kopenhadzkie przywodzenie',sets:3,reps:'20 s / str.',tempo:'2010',weight:'—',rest:120},
  {code:'C1',name:'Podciąganie',sets:3,reps:'max',tempo:'2010',weight:'—',rest:0},
  {code:'C2',name:'Pompki',sets:3,reps:'10',tempo:'20X0',weight:'—',rest:90},
  {code:'D1',name:'Wyciskanie z rotacją',sets:3,reps:'6',tempo:'20X0',weight:'—',rest:0},
  {code:'D2',name:'DB pullover',sets:3,reps:'6',tempo:'20X0',weight:'—',rest:90},
  {code:'E1',name:'Rzuty piłką lekarską',sets:3,reps:'5/5/5/5',tempo:'X!',weight:'—',rest:30},
  {code:'F1',name:'Reverse crunch',sets:2,reps:'10',tempo:'2010',weight:'—',rest:0},
  {code:'F2',name:'Russian twist',sets:2,reps:'30 s',tempo:'szybkie',weight:'—',rest:60}]},
 {title:'Nogi + góra — push',tag:'Push',hero:'lunge',W:[
  {code:'A1',name:'Bulgarian split squat',sets:3,reps:'4',tempo:'40X0',weight:'—',rest:0},
  {code:'A2',name:'Wyskoki na przedniej nodze',sets:3,reps:'4',tempo:'X!',weight:'—',rest:120},
  {code:'B1',name:'Leg curl',sets:3,reps:'6',tempo:'40X0',weight:'—',rest:0},
  {code:'B2',name:'Hip thrust jednonóż',sets:3,reps:'6',tempo:'20X0',weight:'—',rest:120},
  {code:'C1',name:'Wyciskanie na ławce dodatniej',sets:3,reps:'6',tempo:'20X0',weight:'—',rest:0},
  {code:'C2',name:'MB slams zza głowy z rotacją',sets:3,reps:'5',tempo:'X!',weight:'—',rest:90},
  {code:'D1',name:'OHP na sztandze',sets:3,reps:'6',tempo:'2011',weight:'—',rest:0},
  {code:'D2',name:'Lateral raises',sets:3,reps:'6',tempo:'2011',weight:'—',rest:90},
  {code:'E1',name:'Łapki 1 — biceps curls',sets:2,reps:'10',tempo:'szybkie',weight:'—',rest:0},
  {code:'E2',name:'Łapki 2 — triceps ext.',sets:2,reps:'10–15',tempo:'szybkie',weight:'—',rest:90},
  {code:'F1',name:'Sit up + talerz nad głowę',sets:2,reps:'10',tempo:'wolne',weight:'—',rest:0},
  {code:'F2',name:'Plank + hip dips',sets:2,reps:'30 s',tempo:'umiarkowane',weight:'—',rest:60}]},
 {title:'Hinge + plecy',tag:'Plecy',hero:'hinge',W:[
  {code:'A1',name:'TB DL',sets:3,reps:'4',tempo:'20X0',weight:'—',rest:0},
  {code:'A2',name:'Łydki 2/1 — Smith',sets:3,reps:'8 / str.',tempo:'2010',weight:'—',rest:120},
  {code:'B1',name:'Lateral drop + knee drive',sets:3,reps:'6',tempo:'X',weight:'—',rest:0},
  {code:'B2',name:'Leg switches',sets:3,reps:'5 / str.',tempo:'X!',weight:'—',rest:120},
  {code:'C1',name:'LAT pulldown z pauzą u dołu',sets:3,reps:'6',tempo:'2012',weight:'—',rest:0},
  {code:'C2',name:'Y-T-A raises',sets:3,reps:'5',tempo:'2011',weight:'—',rest:90},
  {code:'D1',name:'Rozpiętki',sets:3,reps:'8',tempo:'2111',weight:'—',rest:0},
  {code:'D2',name:'Seated row',sets:3,reps:'8',tempo:'2012',weight:'—',rest:90},
  {code:'E1',name:'Dead bug',sets:2,reps:'30 s',tempo:'wolne',weight:'—',rest:0},
  {code:'E2',name:'Nożyce pionowe',sets:2,reps:'30 s',tempo:'szybkie',weight:'—',rest:0},
  {code:'E3',name:'Plank + arm reach',sets:2,reps:'30 s',tempo:'wolne',weight:'—',rest:60}]}
];

const FIGS = {
 squat:{h:[58,34],p:['M56 42 Q51 52 49 62','M49 62 L70 70','M70 70 L66 100','M53 47 L79 42'],d:['M14 100 H106']},
 lunge:{h:[52,26],p:['M52 34 L52 62','M52 62 L73 70 L73 100','M52 62 L36 84 L27 100','M52 40 L68 52'],d:['M14 100 H106']},
 hinge:{h:[76,40],p:['M70 45 L48 58','M48 58 L46 100','M66 50 L62 76'],d:['M14 100 H106','M46 78 H80']}
};

/* ─── storage (offline-first) ─── */
const load = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch(e){ return f; } };
const persist = () => { localStorage.setItem('fw2_store', JSON.stringify(store)); localStorage.setItem('fw2_queue', JSON.stringify(queue)); };
let store = load('fw2_store', { weights:{}, history:[], wlog:{} });
let queue = load('fw2_queue', []);

/* ─── supabase sync ─── */
const configured = SUPABASE_URL && SUPABASE_ANON_KEY && SYNC_KEY;
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let syncState = configured ? 'sync' : 'off'; // sync | ok | err | off
let flushing = false;

async function flush() {
  if (!db || flushing || !navigator.onLine || !queue.length) { renderSyncDot(); return; }
  flushing = true; syncState = 'sync'; renderSyncDot();
  try {
    while (queue.length) {
      const op = queue[0];
      let r;
      if (op.t === 'weight') r = await db.from('weights').upsert({ sync_key: SYNC_KEY, key: op.key, w: op.w, updated_at: new Date(op.ts).toISOString() });
      else if (op.t === 'wlog') r = await db.from('weight_log').insert({ sync_key: SYNC_KEY, key: op.key, t: new Date(op.ts).toISOString(), w: op.w });
      else if (op.t === 'workout') r = await db.from('workouts').insert({ sync_key: SYNC_KEY, t: new Date(op.ts).toISOString(), plan: op.plan, secs: op.secs, sets: op.sets });
      if (r && r.error) throw r.error;
      queue.shift(); persist();
    }
    syncState = 'ok';
  } catch(e) { console.warn('sync err', e); syncState = 'err'; }
  flushing = false; renderSyncDot();
}

async function pull() {
  if (!db || !navigator.onLine) return;
  try {
    const pendingW = new Set(queue.filter(o => o.t === 'weight').map(o => o.key));
    const [w, h, l] = await Promise.all([
      db.from('weights').select('key,w').eq('sync_key', SYNC_KEY),
      db.from('workouts').select('t,plan,secs,sets').eq('sync_key', SYNC_KEY).order('t', { ascending:false }).limit(50),
      db.from('weight_log').select('key,t,w').eq('sync_key', SYNC_KEY).order('t', { ascending:true }).limit(1000)
    ]);
    if (w.data) w.data.forEach(r => { if (!pendingW.has(r.key)) store.weights[r.key] = +r.w; });
    if (h.data) {
      const seen = new Set(store.history.map(e => e.t));
      h.data.forEach(r => { const t = +new Date(r.t); if (!seen.has(t)) store.history.push({ t, plan:r.plan, secs:r.secs, sets:r.sets }); });
      store.history.sort((a,b) => b.t - a.t); store.history = store.history.slice(0,50);
    }
    if (l.data) {
      l.data.forEach(r => {
        const arr = store.wlog[r.key] || (store.wlog[r.key] = []);
        const t = +new Date(r.t);
        if (!arr.some(x => x.t === t)) arr.push({ t, w:+r.w });
      });
      Object.values(store.wlog).forEach(a => a.sort((x,y) => x.t - y.t));
    }
    persist(); syncState = queue.length ? 'sync' : 'ok';
    if (S.screen === 'home') render();
  } catch(e) { console.warn('pull err', e); syncState = 'err'; renderSyncDot(); }
}

window.addEventListener('online', flush);
setInterval(() => { if (queue.length) flush(); }, 30000);

/* ─── app state ─── */
const S = { screen:'home', plan:0, stepI:0, doneSets:0, restLeft:0, restTotal:0, elapsed:0 };
const stepsCache = {};
function STEPS(plan) {
  if (stepsCache[plan]) return stepsCache[plan];
  const W = PLANS[plan].W, groups = [];
  W.forEach((e,i) => { const L = e.code[0], g = groups[groups.length-1];
    if (g && g.letter === L) g.exs.push(i); else groups.push({ letter:L, exs:[i] }); });
  const steps = [];
  groups.forEach(g => { const rounds = W[g.exs[0]].sets;
    for (let r=1; r<=rounds; r++) g.exs.forEach(i => steps.push({ ex:i, set:r, rest:W[i].rest })); });
  return stepsCache[plan] = steps;
}
const fmt = sec => Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
const fkg = w => (w % 1 ? w.toFixed(1).replace('.',',') : w) + ' kg';
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function tempoHint(t) {
  if (t === 'X!' || t === 'X') return 'maks. dynamicznie';
  if (!/^[0-9X!]{4}$/.test(t)) return '';
  const c = t.split(''), v = x => x === 'X' || x === '!' ? 'dyn.' : x + ' s';
  const p = ['↓ ' + v(c[0])];
  if (c[1] !== '0') p.push('pauza ' + v(c[1]));
  p.push('↑ ' + v(c[2]));
  if (c[3] !== '0') p.push('góra ' + v(c[3]));
  return p.join(' · ');
}

/* ─── sound + vibration ─── */
let actx;
function tone(freq, delays, vol, dur) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    delays.forEach(dt => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime + dt);
      g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dt + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + dt); o.stop(actx.currentTime + dt + dur + 0.02);
    });
  } catch(e){}
}
const tap = () => { try { navigator.vibrate && navigator.vibrate(40); } catch(e){} tone(660, [0], 0.18, 0.12); };
const cue = () => { try { navigator.vibrate && navigator.vibrate([180,90,180]); } catch(e){} tone(880, [0,0.22], 0.25, 0.16); };

/* ─── data ops ─── */
function setW(key, v) { store.weights[key] = v; queue.push({ t:'weight', key, w:v, ts:Date.now() }); persist(); flush(); }
function logWeight(key, w) {
  if (!(w > 0)) return;
  const arr = store.wlog[key] || (store.wlog[key] = []);
  const last = arr[arr.length-1];
  if (last && last.w === w && Date.now() - last.t < 20*3600000) return;
  arr.push({ t:Date.now(), w }); store.wlog[key] = arr.slice(-40);
  queue.push({ t:'wlog', key, w, ts:Date.now() }); persist(); flush();
}
function saveWorkout() {
  const e = { t:Date.now(), plan:S.plan, secs:S.elapsed, sets:STEPS(S.plan).length };
  store.history.unshift(e); store.history = store.history.slice(0,50);
  queue.push({ t:'workout', ts:e.t, plan:e.plan, secs:e.secs, sets:e.sets }); persist(); flush();
}

/* ─── actions ─── */
const A = {
  pick(i) { S.plan = i; render(); },
  start() { S.screen = 'workout'; S.stepI = 0; S.doneSets = 0; S.elapsed = 0; render(); },
  quit() { S.screen = 'home'; S.stepI = 0; S.doneSets = 0; S.elapsed = 0; S.restLeft = 0; render(); },
  nav(d) {
    if (d < 0 && S.stepI <= 0 && S.screen !== 'rest') return A.quit();
    S.stepI = Math.min(STEPS(S.plan).length-1, Math.max(0, S.stepI + d));
    S.doneSets = S.stepI; S.screen = 'workout'; render();
  },
  inc(key, cur) { setW(key, cur + 2.5); render(); },
  dec(key, cur) { setW(key, Math.max(0, cur - 2.5)); render(); },
  addW(key) { setW(key, 2.5); render(); },
  done() {
    const steps = STEPS(S.plan), step = steps[S.stepI];
    const ex = PLANS[S.plan].W[step.ex], key = S.plan + '|' + ex.code;
    const planW = parseFloat(String(ex.weight).replace(',','.')) || 0;
    const curW = store.weights[key] != null ? store.weights[key] : planW;
    tap(); logWeight(key, curW);
    S.doneSets++;
    if (S.stepI >= steps.length-1) { saveWorkout(); S.screen = 'done'; }
    else if (!step.rest) { S.stepI++; }
    else { S.screen = 'rest'; S.restLeft = step.rest; S.restTotal = step.rest; }
    render();
  },
  skipRest() { advance(); render(); }
};
function advance() {
  const n = STEPS(S.plan).length;
  if (S.stepI + 1 >= n) S.screen = 'done';
  else { S.stepI++; S.screen = 'workout'; }
}

/* ─── timer ─── */
setInterval(() => {
  if (S.screen === 'workout') { S.elapsed++; tick(); }
  else if (S.screen === 'rest') {
    S.elapsed++;
    if (S.restLeft <= 1) { cue(); advance(); render(); }
    else { S.restLeft--; tick(); }
  }
}, 1000);
function tick() {
  const el = document.getElementById('elT'); if (el) el.textContent = fmt(S.elapsed);
  const rt = document.getElementById('restT'); if (rt) rt.textContent = fmt(S.restLeft);
  const ring = document.getElementById('ringFg');
  if (ring) { const C = 2*Math.PI*82; ring.setAttribute('stroke-dashoffset', C * (1 - (S.restTotal ? S.restLeft/S.restTotal : 0))); }
}

/* ─── views ─── */
function figSvg(type, size, anim) {
  const f = FIGS[type]; if (!f) return '';
  const dim = f.d.map(d => `<path d="${d}" stroke="rgba(255,255,255,0.12)" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('');
  const main = `<g class="${anim ? 'fig-anim' : ''}" stroke="rgba(110,231,183,0.5)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="${f.h[0]}" cy="${f.h[1]}" r="7.5"/>${f.p.map(d => `<path d="${d}"/>`).join('')}</g>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" style="overflow:visible">${dim}${main}</svg>`;
}

const syncLabel = () => ({ off:'bez synchronizacji', sync:'synchronizuję…', ok:'zsynchronizowano', err:'offline — w kolejce: ' + queue.length })[syncState];
const syncColor = () => ({ off:'#55556a', sync:'#fbbf24', ok:'#6ee7b7', err:'#fbbf24' })[syncState];
function renderSyncDot() {
  const el = document.getElementById('syncDot');
  if (el) el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${syncColor()};display:inline-block"></span> ${syncLabel()}`;
}

function homeView() {
  const P = PLANS[S.plan], steps = STEPS(S.plan);
  const last = store.history.find(e => e.plan === S.plan);
  const lastLabel = last ? 'Ostatnio: ' + fmt(last.secs) + ' · ' + new Date(last.t).toLocaleDateString('pl-PL',{day:'numeric',month:'short'}) : 'Jeszcze nie wykonany';
  const blocks = [];
  P.W.forEach(e => { const L = e.code[0], g = blocks[blocks.length-1];
    if (g && g.letter === L) g.parts.push(e.name); else blocks.push({ letter:L, parts:[e.name], rounds:e.sets + '×' }); });
  return `
  <div style="display:flex;flex-direction:column;gap:22px;padding-top:12px;flex:1">
    <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
      <span class="pill">Wybierz trening</span>
      <div class="tabs">${PLANS.map((p,i) =>
        `<button class="tab ${i===S.plan?'on':''}" onclick="A.pick(${i})"><b>${i+1}</b><i>${p.tag}</i></button>`).join('')}
      </div>
    </div>
    <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
          <h1 style="font-size:24px;font-weight:900;letter-spacing:-0.5px;line-height:1.1">${esc(P.title)}</h1>
          <div style="color:#8888a0;font-size:13px">${P.W.length} ćwiczeń · ${steps.length} serii · ok. ${Math.round(steps.length*1.6/5)*5} min</div>
          <div class="mono" style="font-size:11px;font-weight:700;color:#6ee7b7">${lastLabel}</div>
        </div>
        <div style="flex-shrink:0">${figSvg(P.hero, 92, true)}</div>
      </div>
      <button class="btn-primary" onclick="A.start()">Rozpocznij trening</button>
    </div>
    <div class="card" style="flex:1;padding:10px 18px;display:flex;flex-direction:column">
      <div class="lbl" style="padding:6px 0 8px">Przebieg</div>
      ${blocks.map(b => `
      <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,0.05)">
        <span class="mono" style="font-size:11px;font-weight:700;color:#6ee7b7;background:rgba(110,231,183,0.12);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">${b.letter}</span>
        <span style="flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.parts.join(' + '))}</span>
        <span class="mono" style="font-size:11.5px;color:#55556a;flex-shrink:0">${b.rounds}</span>
      </div>`).join('')}
    </div>
    <div id="syncDot" class="mono" style="font-size:10.5px;color:#55556a;display:flex;align-items:center;gap:7px;justify-content:center"></div>
  </div>`;
}

function activeChrome(inner) {
  const steps = STEPS(S.plan), W = PLANS[S.plan].W;
  const step = steps[Math.min(S.stepI, steps.length-1)], ex = W[step.ex];
  const letters = [...new Set(W.map(e => e.code[0]))];
  const counter = String(letters.indexOf(ex.code[0])+1).padStart(2,'0') + ' / ' + String(letters.length).padStart(2,'0');
  const pct = Math.round(S.doneSets / steps.length * 100);
  return `
  <div style="display:flex;flex-direction:column;flex:1">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button class="nav" onclick="A.nav(-1)">‹</button>
      <span class="mono" style="font-size:13px;font-weight:700;letter-spacing:2px;color:#8888a0">${counter}</span>
      <button class="nav ${S.stepI >= steps.length-1 ? 'off' : ''}" onclick="A.nav(1)">›</button>
    </div>
    <div class="progress" style="margin-bottom:6px"><div style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span id="elT" class="mono" style="font-size:11px;font-weight:700;color:#6ee7b7">${fmt(S.elapsed)}</span>
      <span class="mono" style="font-size:10.5px;font-weight:600;color:#55556a">${pct}% · ${S.doneSets}/${steps.length} serii</span>
    </div>
    ${inner}
  </div>`;
}

function workoutView() {
  const steps = STEPS(S.plan), W = PLANS[S.plan].W;
  const step = steps[S.stepI], ex = W[step.ex];
  const key = S.plan + '|' + ex.code;
  const planW = parseFloat(String(ex.weight).replace(',','.')) || 0;
  const curW = store.weights[key] != null ? store.weights[key] : planW;
  const hasW = planW > 0 || store.weights[key] != null;
  const arr = store.wlog[key] || [];
  const prev = [...arr].reverse().find(x => Date.now() - x.t > 20*3600000);
  const wHint = prev ? 'poprzednio: ' + fkg(prev.w) : (planW > 0 ? 'wg planu: ' + fkg(planW) : 'pierwszy raz');
  const nxt = steps[S.stepI+1];
  const nextLabel = nxt ? esc(W[nxt.ex].name) + (W[nxt.ex].sets > 1 ? ' — seria ' + nxt.set + ' z ' + W[nxt.ex].sets : '') : 'Koniec treningu';
  const th = tempoHint(ex.tempo);
  return activeChrome(`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;text-align:center;padding:12px 0">
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
        <span class="mono" style="font-size:11px;font-weight:700;color:#6ee7b7;background:rgba(110,231,183,0.12);padding:4px 12px;border-radius:50px;letter-spacing:1px">${ex.code}</span>
        <h2 style="font-size:27px;font-weight:800;letter-spacing:-0.3px;line-height:1.15;text-wrap:balance">${esc(ex.name)}</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <span class="lbl" style="letter-spacing:3px">Seria</span>
        <div class="mono" style="font-weight:700;font-size:64px;line-height:1;color:#6ee7b7">${step.set}<span style="color:#55556a;font-size:30px;font-weight:600"> / ${ex.sets}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-width:340px">
        ${hasW ? `
        <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:10px 14px;width:100%">
          <div style="text-align:left">
            <div class="lbl" style="font-size:10px;letter-spacing:1px">Ciężar</div>
            <div style="font-size:11px;color:#8888a0;margin-top:2px">${wHint}</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <button class="stepbtn" style="background:#1e1e2a;border:1px solid rgba(255,255,255,0.08);color:#8888a0" onclick="A.dec('${key}',${curW})">−</button>
            <span class="mono" style="font-size:17px;font-weight:700;color:#6ee7b7;min-width:72px;text-align:center">${curW > 0 ? fkg(curW) : '—'}</span>
            <button class="stepbtn" style="background:rgba(110,231,183,0.1);border:1px solid rgba(110,231,183,0.3);color:#6ee7b7" onclick="A.inc('${key}',${curW})">+</button>
          </div>
        </div>` : ''}
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%">
          <div class="stat"><div class="k">Powtórzenia</div><div class="v" style="color:#6ee7b7">${esc(ex.reps)}</div></div>
          <div class="stat"><div class="k">Tempo</div><div class="v">${esc(ex.tempo)}</div>${th ? `<div style="font-size:10px;color:#55556a;margin-top:3px">${th}</div>` : ''}</div>
        </div>
        ${!hasW ? `<button style="background:transparent;border:none;color:#55556a;font-size:12.5px;font-weight:600;padding:2px" onclick="A.addW('${key}')">+ Dodaj obciążenie</button>` : ''}
      </div>
    </div>
    <button class="btn-main" onclick="A.done()">Seria ukończona</button>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;min-height:18px">
      <span class="lbl" style="font-size:11px;letter-spacing:1.5px">Następnie</span>
      <span style="font-size:13px;font-weight:600;color:#8888a0">${nextLabel}</span>
    </div>`);
}

function restView() {
  const steps = STEPS(S.plan), W = PLANS[S.plan].W;
  const nxt = steps[S.stepI+1];
  const nextLabel = nxt ? esc(W[nxt.ex].name) + (W[nxt.ex].sets > 1 ? ' — seria ' + nxt.set + ' z ' + W[nxt.ex].sets : '') : 'Koniec treningu';
  const C = 2*Math.PI*82, off = C * (1 - (S.restTotal ? S.restLeft/S.restTotal : 0));
  return activeChrome(`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center">
      <span class="lbl" style="font-size:12px;letter-spacing:4px;animation:restPulse 2.4s ease-in-out infinite">Odpoczynek</span>
      <div style="position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center">
        <svg width="180" height="180" viewBox="0 0 180 180" style="transform:rotate(-90deg)">
          <circle cx="90" cy="90" r="82" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <circle id="ringFg" cx="90" cy="90" r="82" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s linear"/>
        </svg>
        <span id="restT" class="mono" style="position:absolute;font-size:40px;font-weight:700;color:#6ee7b7">${fmt(S.restLeft)}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="lbl" style="font-size:11px;letter-spacing:1.5px">Następnie</span>
        <span style="font-size:16px;font-weight:700">${nextLabel}</span>
      </div>
    </div>
    <button class="btn-ghost" onclick="A.skipRest()">Pomiń odpoczynek</button>`);
}

function doneView() {
  return `
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:12px 0">
    <div style="width:88px;height:88px;border-radius:50%;background:rgba(110,231,183,0.12);border:1px solid rgba(110,231,183,0.3);display:flex;align-items:center;justify-content:center;font-size:38px;color:#6ee7b7;box-shadow:0 0 50px rgba(110,231,183,0.2)">✓</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <h2 style="font-size:28px;font-weight:900;letter-spacing:-0.4px">Trening ukończony</h2>
      <span style="color:#8888a0;font-size:14.5px">Dobra robota. Spokojnie się rozciągnij.</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.06);border-radius:14px;overflow:hidden;width:100%;max-width:340px">
      <div style="background:#1e1e2a;padding:18px 8px"><div class="mono" style="font-size:20px;font-weight:800;color:#6ee7b7">${fmt(S.elapsed)}</div><div class="lbl" style="font-size:10px;letter-spacing:1px;margin-top:4px">Czas</div></div>
      <div style="background:#1e1e2a;padding:18px 8px"><div class="mono" style="font-size:20px;font-weight:800;color:#6ee7b7">${S.doneSets}</div><div class="lbl" style="font-size:10px;letter-spacing:1px;margin-top:4px">Serie</div></div>
      <div style="background:#1e1e2a;padding:18px 8px"><div class="mono" style="font-size:20px;font-weight:800;color:#6ee7b7">${PLANS[S.plan].W.length}</div><div class="lbl" style="font-size:10px;letter-spacing:1px;margin-top:4px">Ćwiczenia</div></div>
    </div>
    <button class="btn-ghost" style="max-width:340px" onclick="A.quit()">Wróć do startu</button>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = S.screen === 'home' ? homeView() : S.screen === 'workout' ? workoutView() : S.screen === 'rest' ? restView() : doneView();
  renderSyncDot();
}

render();
pull().then(flush);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
